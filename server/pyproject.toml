[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "btsync"
version = "0.1.0"
description = "Sincronizacion Bluetooth de inventario fisico hacia Oracle"
requires-python = ">=3.12"
dependencies = ["oracledb>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]
# BluezTransport se adueña del descriptor que entrega NewConnection: dbus-fast 5.x no lo cierra.
bluez = ["dbus-fast>=5.2,<6"]

[tool.setuptools.packages.find]
include = ["btsync*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
