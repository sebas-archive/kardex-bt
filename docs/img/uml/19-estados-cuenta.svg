<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="723px" preserveAspectRatio="none" style="width:774px;height:723px;background:#FFFFFF;" version="1.1" viewBox="0 0 774 723" width="774px" zoomAndPan="magnify"><title>19 &#183; M&#225;quina de estados de una cuenta</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="332.915" x="214.0142" y="23.9233">19 &#183; M&#225;quina de estados de una cuenta</text><ellipse cx="386" cy="54.4609" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><path d="M288,153.4609 L484.3359,153.4609 A3,3 0 0 1 487.3359,156.4609 L487.3359,177.4297 L285,177.4297 L285,156.4609 A3,3 0 0 1 288,153.4609 " fill="#F1F1F1" style="stroke:#F1F1F1;stroke-width:1.0;"/><rect fill="none" height="85.9688" rx="3" ry="3" style="stroke:#181818;stroke-width:0.5;" width="202.3359" x="285" y="153.4609"/><line style="stroke:#181818;stroke-width:0.5;" x1="285" x2="487.3359" y1="177.4297" y2="177.4297"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="68.0449" x="352.1455" y="169.5996">PENDIENTE</text><rect fill="#F1F1F1" height="40" rx="3" ry="3" style="stroke:#181818;stroke-width:0.5;" width="182.3359" x="297" y="189.4297"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="108.7734" x="333.7813" y="206.5996">Estado de cuenta:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="172.3359" x="302" y="220.5684">&#171;Comprobar estado&#187; (m&#243;vil)</text><path d="M36,328.4609 L242.2793,328.4609 A3,3 0 0 1 245.2793,331.4609 L245.2793,352.4297 L33,352.4297 L33,331.4609 A3,3 0 0 1 36,328.4609 " fill="#F1F1F1" style="stroke:#F1F1F1;stroke-width:1.0;"/><rect fill="none" height="85.9688" rx="3" ry="3" style="stroke:#181818;stroke-width:0.5;" width="212.2793" x="33" y="328.4609"/><line style="stroke:#181818;stroke-width:0.5;" x1="33" x2="245.2793" y1="352.4297" y2="352.4297"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="45.1113" x="116.584" y="344.5996">ACTIVO</text><rect fill="#F1F1F1" height="40" rx="3" ry="3" style="stroke:#181818;stroke-width:0.5;" width="192.2793" x="45" y="364.4297"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="182.2793" x="50" y="381.5996">Entra al escritorio o sincroniza</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="73.5586" x="104.3604" y="395.5684">seg&#250;n su rol</text><rect fill="#F1F1F1" height="40" rx="3" ry="3" style="stroke:#181818;stroke-width:0.5;" width="86.6465" x="589.5" y="351.4609"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="76.6465" x="594.5" y="375.6152">RECHAZADO</text><ellipse cx="633" cy="546.4609" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="633" cy="546.4609" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><path d="M73.5,503.4609 L206.2734,503.4609 A3,3 0 0 1 209.2734,506.4609 L209.2734,527.4297 L70.5,527.4297 L70.5,506.4609 A3,3 0 0 1 73.5,503.4609 " fill="#F1F1F1" style="stroke:#F1F1F1;stroke-width:1.0;"/><rect fill="none" height="85.9688" rx="3" ry="3" style="stroke:#181818;stroke-width:0.5;" width="138.7734" x="70.5" y="503.4609"/><line style="stroke:#181818;stroke-width:0.5;" x1="70.5" x2="209.2734" y1="527.4297" y2="527.4297"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="79.2773" x="100.248" y="519.5996">SUSPENDIDO</text><rect fill="#F1F1F1" height="40" rx="3" ry="3" style="stroke:#181818;stroke-width:0.5;" width="118.7734" x="82.5" y="539.4297"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="108.7734" x="87.5" y="556.5996">Estado de cuenta:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="89.4082" x="97.1826" y="570.5684">motivo y fecha</text><g id="elem_GMN17"><path d="M522.5,173.4609 L522.5,192.4609 L487.5,196.4609 L522.5,200.4609 L522.5,219.3672 A3,3 0 0 0 525.5,222.3672 L758.8496,222.3672 A3,3 0 0 0 761.8496,219.3672 L761.8496,180.4609 L751.8496,170.4609 L525.5,170.4609 A3,3 0 0 0 522.5,173.4609 " fill="#FFF8E1" style="stroke:#F79009;stroke-width:0.5;"/><path d="M751.8496,170.4609 L751.8496,178.9609 A1.5,1.5 0 0 0 753.3496,180.4609 L761.8496,180.4609 L751.8496,170.4609 " fill="#FFF8E1" style="stroke:#F79009;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="199.1367" x="528.5" y="186.5996">La cuenta del m&#243;vil llega al PC al</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="218.3496" x="528.5" y="200.5684">sincronizar (ACCT). El Administrador</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="120.5391" x="528.5" y="214.5371">la ve en Solicitudes.</text></g><g id="elem_GMN20"><path d="M280,348.4609 L280,367.4609 L245.15,371.4609 L280,375.4609 L280,394.3672 A3,3 0 0 0 283,397.3672 L550.5918,397.3672 A3,3 0 0 0 553.5918,394.3672 L553.5918,355.4609 L543.5918,345.4609 L283,345.4609 A3,3 0 0 0 280,348.4609 " fill="#FFF8E1" style="stroke:#F79009;stroke-width:0.5;"/><path d="M543.5918,345.4609 L543.5918,353.9609 A1.5,1.5 0 0 0 545.0918,355.4609 L553.5918,355.4609 L543.5918,345.4609 " fill="#FFF8E1" style="stroke:#F79009;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="252.5918" x="286" y="361.5996">Solo una cuenta ACTIVO entrega lecturas.</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="222.2051" x="286" y="375.5684">El estado se lee al empezar la sesi&#243;n</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="235.1895" x="286" y="389.5371">de sincronizaci&#243;n y vale para toda ella.</text></g><g id="elem_GMN23"><path d="M6,653.4609 L6,713.3359 A3,3 0 0 0 9,716.3359 L271.2715,716.3359 A3,3 0 0 0 274.2715,713.3359 L274.2715,660.4609 L264.2715,650.4609 L144,650.4609 L140,589.8009 L136,650.4609 L9,650.4609 A3,3 0 0 0 6,653.4609 " fill="#FFF8E1" style="stroke:#F79009;stroke-width:0.5;"/><path d="M264.2715,650.4609 L264.2715,658.9609 A1.5,1.5 0 0 0 265.7715,660.4609 L274.2715,660.4609 L264.2715,650.4609 " fill="#FFF8E1" style="stroke:#F79009;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="235.0781" x="12" y="666.5996">El Administrador es &#250;nico: no se puede</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="247.2715" x="12" y="680.5684">suspender ni degradar. Su contrase&#241;a se</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="234.6445" x="12" y="694.5371">recupera con la pregunta de seguridad</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="241.0488" x="12" y="708.5059">desde Acceso, sin pasar por Solicitudes.</text></g><!--link *start* to PENDIENTE--><g id="link_*start*_PENDIENTE"><path d="M386,64.6509 C386,82.3509 386,116.1909 386,147.2809 " fill="none" id="*start*-to-PENDIENTE" style="stroke:#475467;stroke-width:1.0;"/><polygon fill="#475467" points="386,153.2809,390,144.2809,386,148.2809,382,144.2809,386,153.2809" style="stroke:#475467;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="145.0664" x="430.2363" y="106.5996">cuenta del m&#243;vil creada</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="231.5391" x="387" y="120.5684">(o cuenta del PC que no es la primera)</text></g><!--link PENDIENTE to ACTIVO--><g id="link_PENDIENTE_ACTIVO"><path d="M325.89,239.5609 C287.48,266.4609 242.7543,297.7886 204.2943,324.7286 " fill="none" id="PENDIENTE-to-ACTIVO" style="stroke:#475467;stroke-width:1.0;"/><polygon fill="#475467" points="199.38,328.1709,209.0463,326.2837,203.4753,325.3023,204.4566,319.7313,199.38,328.1709" style="stroke:#475467;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="153.1348" x="323.9238" y="281.5996">el Administrador aprueba</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="242.9824" x="279" y="295.5684">(m&#243;vil &#8594; OPERADOR; PC &#8594; INVENTARIO)</text></g><!--link PENDIENTE to RECHAZADO--><g id="link_PENDIENTE_RECHAZADO"><path d="M480.64,239.4609 C497.63,248.4709 514.75,258.5809 530,269.4609 C564.05,293.7509 593.5514,324.8221 612.6914,346.6221 " fill="none" id="PENDIENTE-to-RECHAZADO" style="stroke:#475467;stroke-width:1.0;"/><polygon fill="#475467" points="616.65,351.1309,613.7179,341.7287,613.3511,347.3736,607.7062,347.0068,616.65,351.1309" style="stroke:#475467;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="150.7969" x="564" y="281.5996">el Administrador rechaza</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="116.8242" x="580.9863" y="295.5684">con motivo (&#8804; 300)</text></g><!--link RECHAZADO to *end*--><g id="link_RECHAZADO_*end*"><path d="M633,391.6409 C633,428.2309 633,500.9109 633,529.1209 " fill="none" id="RECHAZADO-to-*end*" style="stroke:#475467;stroke-width:1.0;"/><polygon fill="#475467" points="633,535.1209,637,526.1209,633,530.1209,629,526.1209,633,535.1209" style="stroke:#475467;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="132.9434" x="634" y="463.5996">no entra; ve el motivo</text></g><!--link ACTIVO to SUSPENDIDO--><g id="link_ACTIVO_SUSPENDIDO"><path d="M46.06,414.5309 C24.1,430.6709 10.3,450.7309 23,473.4609 C33.65,492.5109 46.4504,504.1124 65.1604,515.0524 " fill="none" id="ACTIVO-to-SUSPENDIDO" style="stroke:#475467;stroke-width:1.0;"/><polygon fill="#475467" points="70.34,518.0809,64.5897,510.0851,66.0237,515.5571,60.5516,516.9911,70.34,518.0809" style="stroke:#475467;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="160.9863" x="36.2607" y="456.5996">el Administrador suspende</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="185.5078" x="24" y="470.5684">con motivo (nunca a s&#237; mismo)</text></g><!--link SUSPENDIDO to ACTIVO--><g id="link_SUSPENDIDO_ACTIVO"><path d="M196.21,503.4109 C212.11,486.2209 222.95,465.4609 214,444.4609 C209.33,433.5009 206.1278,427.8398 197.9478,418.8898 " fill="none" id="SUSPENDIDO-to-ACTIVO" style="stroke:#475467;stroke-width:1.0;"/><polygon fill="#475467" points="193.9,414.4609,197.0192,423.8028,197.2732,418.1517,202.9244,418.4057,193.9,414.4609" style="stroke:#475467;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="152.0332" x="219" y="463.5996">el Administrador reactiva</text></g><!--SRC=[VLCzQnj14EttLqnSMI4M3gaYG-2G3o98B24vBXAdME-jvOMzdVD-29oGDf3M_o2GBgG8BW999_qJ_vBCt9rziX3kbjcPDs_Ul7bYdBAfqA13D1Rx9fLMH1EjXkSlOVa7tgw-NoRZ93Gvii30pqGHbRIBKbmO_YghU4KVGNbJHODEY0zFFyBUtYkOv4U7e_peE8T1Mq9v5ihLpS9OK5xBGfwwNLp_d0pXCcbmI3t1IgYyARMNFT61CNGsF1wTZ0cNIhAYDCw4w8cY1rdvfCyOj-rp-_KQnfDycXsEfmUCpu7HqGbXPTFHU1DvcWzVP-yfUHkur-f2VY9mXGvAZ6Q1i7lxxGUysD_lYQwKWLY5GJs8e-e3M6Z6Quf4ov_pPkzcDOFj7KCAbNQ5VjZI9QSaI0YhNr2QK69FhC4yBX39hWX52a5BZVekyxC0Q08xEHC6QQ5UQaHl41026SQZCpn-qFFLNqVamAFT0SdEe28KNrhGJjDrtDf5RA9cuODJj_mvnBBoU2PzQxBbFsWtrwk1UVfxsBKX7yTjXRg2SzvO3SHA4f1mI3NUp2yYu7b7