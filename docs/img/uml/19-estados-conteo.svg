<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="501px" preserveAspectRatio="none" style="width:586px;height:501px;background:#FFFFFF;" version="1.1" viewBox="0 0 586 501" width="586px" zoomAndPan="magnify"><title>19 &#183; M&#225;quina de estados de un conteo y su efecto en SIN_CONTAR</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="558.3325" x="10" y="23.9233">19 &#183; M&#225;quina de estados de un conteo y su efecto en SIN_CONTAR</text><ellipse cx="132.6731" cy="54.4609" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><path d="M29.6731,139.4609 L235.6946,139.4609 A3,3 0 0 1 238.6946,142.4609 L238.6946,163.4297 L26.6731,163.4297 L26.6731,142.4609 A3,3 0 0 1 29.6731,139.4609 " fill="#F1F1F1" style="stroke:#F1F1F1;stroke-width:1.0;"/><rect fill="none" height="97.875" rx="3" ry="3" style="stroke:#181818;stroke-width:0.5;" width="212.0215" x="26.6731" y="139.4609"/><line style="stroke:#181818;stroke-width:0.5;" x1="26.6731" x2="238.6946" y1="163.4297" y2="163.4297"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="52.6758" x="106.3459" y="155.5996">ABIERTO</text><rect fill="#F1F1F1" height="51.9063" rx="3" ry="3" style="stroke:#181818;stroke-width:0.5;" width="192.0215" x="38.6731" y="175.4297"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="174.2285" x="47.5696" y="191.5684">SKU del sistema sin lecturas:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="149.1445" x="60.1116" y="205.5371">SIN_CONTAR (contada 0,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="182.0215" x="43.6731" y="219.5059">diferencia, % y valor en NULL)</text><path d="M21.6731,326.4609 L243.2922,326.4609 A3,3 0 0 1 246.2922,329.4609 L246.2922,350.4297 L18.6731,350.4297 L18.6731,329.4609 A3,3 0 0 1 21.6731,326.4609 " fill="#F1F1F1" style="stroke:#F1F1F1;stroke-width:1.0;"/><rect fill="none" height="85.9688" rx="3" ry="3" style="stroke:#181818;stroke-width:0.5;" width="227.6191" x="18.6731" y="326.4609"/><line style="stroke:#181818;stroke-width:0.5;" x1="18.6731" x2="246.2922" y1="350.4297" y2="350.4297"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="59.5313" x="102.717" y="342.5996">CERRADO</text><rect fill="#F1F1F1" height="40" rx="3" ry="3" style="stroke:#181818;stroke-width:0.5;" width="207.6191" x="30.6731" y="362.4297"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="185.4082" x="41.7786" y="379.5996">SIN_CONTAR pasa a FALTANTE</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="197.6191" x="35.6731" y="393.5684">(contada 0, diferencia &#8722;sistema)</text><ellipse cx="132.6731" cy="484.4609" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="132.6731" cy="484.4609" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><g id="elem_GMN11"><path d="M273.6731,165.4609 L273.6731,184.4609 L238.7431,188.4609 L273.6731,192.4609 L273.6731,211.3672 A3,3 0 0 0 276.6731,214.3672 L514.552,214.3672 A3,3 0 0 0 517.552,211.3672 L517.552,172.4609 L507.552,162.4609 L276.6731,162.4609 A3,3 0 0 0 273.6731,165.4609 " fill="#FFF8E1" style="stroke:#F79009;stroke-width:0.5;"/><path d="M507.552,162.4609 L507.552,170.9609 A1.5,1.5 0 0 0 509.052,172.4609 L517.552,172.4609 L507.552,162.4609 " fill="#FFF8E1" style="stroke:#F79009;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="219.1816" x="279.6731" y="178.5996">Acepta lecturas. Cada batch concilia</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="222.8789" x="279.6731" y="192.5684">de nuevo la uni&#243;n de la foto de stock</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="192.2754" x="279.6731" y="206.5371">y los SKU con lecturas vigentes.</text></g><g id="elem_GMN14"><path d="M282.1731,346.4609 L282.1731,365.4609 L246.7531,369.4609 L282.1731,373.4609 L282.1731,392.3672 A3,3 0 0 0 285.1731,395.3672 L570.6594,395.3672 A3,3 0 0 0 573.6594,392.3672 L573.6594,353.4609 L563.6594,343.4609 L285.1731,343.4609 A3,3 0 0 0 282.1731,346.4609 " fill="#FFF8E1" style="stroke:#F79009;stroke-width:0.5;"/><path d="M563.6594,343.4609 L563.6594,351.9609 A1.5,1.5 0 0 0 565.1594,353.4609 L573.6594,353.4609 L563.6594,343.4609 " fill="#FFF8E1" style="stroke:#F79009;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="231.6738" x="288.1731" y="359.5996">Una lectura que llegue despu&#233;s queda</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="212.0918" x="288.1731" y="373.5684">en ERROR (CONTEO_NO_ABIERTO).</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="270.4863" x="288.1731" y="387.5371">Solo se env&#237;an al m&#243;vil los conteos ABIERTO.</text></g><!--link *start* to ABIERTO--><g id="link_*start*_ABIERTO"><path d="M132.6731,64.5309 C132.6731,79.8509 132.6731,105.8709 132.6731,133.3909 " fill="none" id="*start*-to-ABIERTO" style="stroke:#475467;stroke-width:1.0;"/><polygon fill="#475467" points="132.6731,139.3909,136.6731,130.3909,132.6731,134.3909,128.6731,130.3909,132.6731,139.3909" style="stroke:#475467;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="89.6836" x="133.6731" y="106.5996">alta del conteo</text></g><!--link ABIERTO to CERRADO--><g id="link_ABIERTO_CERRADO"><path d="M132.6731,237.9009 C132.6731,265.5409 132.6731,293.8609 132.67