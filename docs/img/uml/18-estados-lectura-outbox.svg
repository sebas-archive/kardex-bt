<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="456px" preserveAspectRatio="none" style="width:691px;height:456px;background:#FFFFFF;" version="1.1" viewBox="0 0 691 456" width="691px" zoomAndPan="magnify"><title>18 &#183; M&#225;quina de estados de una lectura en la Outbox del m&#243;vil</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="530.3687" x="73.4143" y="23.9233">18 &#183; M&#225;quina de estados de una lectura en la Outbox del m&#243;vil</text><ellipse cx="471.5" cy="70.4609" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F1F1F1" height="40" rx="3" ry="3" style="stroke:#181818;stroke-width:0.5;" width="78.0449" x="194.5" y="191.9609"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="68.0449" x="199.5" y="216.1152">PENDIENTE</text><rect fill="#F1F1F1" height="40" rx="3" ry="3" style="stroke:#181818;stroke-width:0.5;" width="65.2012" x="41" y="50.4609"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="55.2012" x="46" y="74.6152">ENVIADO</text><rect fill="#F1F1F1" height="40" rx="3" ry="3" style="stroke:#181818;stroke-width:0.5;" width="92.8281" x="7" y="327.4609"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="82.8281" x="12" y="351.6152">CONFIRMADO</text><ellipse cx="53.5" cy="439.4609" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="53.5" cy="439.4609" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><g id="elem_GMN14"><path d="M141,47.4609 L141,66.4609 L106.31,70.4609 L141,74.4609 L141,93.3672 A3,3 0 0 0 144,96.3672 L422.5137,96.3672 A3,3 0 0 0 425.5137,93.3672 L425.5137,54.4609 L415.5137,44.4609 L144,44.4609 A3,3 0 0 0 141,47.4609 " fill="#FFF8E1" style="stroke:#F79009;stroke-width:0.5;"/><path d="M415.5137,44.4609 L415.5137,52.9609 A1.5,1.5 0 0 0 417.0137,54.4609 L425.5137,54.4609 L415.5137,44.4609 " fill="#FFF8E1" style="stroke:#F79009;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="262.4941" x="147" y="60.5996">Una lectura ENVIADO o CONFIRMADO no se</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="244.8867" x="147" y="74.5684">modifica: recontar inserta una fila nueva</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="263.5137" x="147" y="88.5371">y el PC se queda con la m&#225;s reciente (D13).</text></g><!--link *start* to PENDIENTE--><g id="link_*start*_PENDIENTE"><path d="M467.44,79.7309 C458.78,96.5109 436.87,134.7509 407.5,155.4609 C366.69,184.2409 316.1332,197.5476 278.7332,204.3476 " fill="none" id="*start*-to-PENDIENTE" style="stroke:#475467;stroke-width:1.0;"/><polygon fill="#475467" points="272.83,205.4209,282.4004,207.7464,277.7493,204.5265,280.9693,199.8755,272.83,205.4209" style="stroke:#475467;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="55.8633" x="531.917" y="138.5996">insertar()</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="246.6973" x="436.5" y="152.5684">(guardar siempre primero en el tel&#233;fono)</text></g><!--link PENDIENTE to PENDIENTE--><g id="link_PENDIENTE_PENDIENTE"><path d="M272.71,199.1209 C291.23,197.6309 307.5,201.9109 307.5,211.9609 C307.5,222.0109 297.2107,226.7721 278.6907,225.2821 " fill="none" id="PENDIENTE-to-PENDIENTE" style="stroke:#475467;stroke-width:1.0;"/><polygon fill="#475467" points="272.71,224.8009,281.3602,229.5098,277.6939,225.2019,282.0018,221.5356,272.71,224.8009" style="stroke:#475467;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="77.6426" x="350.9736" y="202.5996">reemplazar()</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="152.5898" x="313.5" y="216.5684">[recuento del mismo SKU</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="103.8574" x="337.8662" y="230.5371">que a&#250;n no sali&#243;]</text></g><!--link PENDIENTE to ENVIADO--><g id="link_PENDIENTE_ENVIADO"><path d="M194.36,199.2909 C151.16,186.0309 86.73,165.0009 79.5,155.4609 C65.47,136.9309 65.6391,114.9414 68.4791,96.4514 " fill="none" id="PENDIENTE-to-ENVIADO" style="stroke:#475467;stroke-width:1.0;"/><polygon fill="#475467" points="69.39,90.5209,64.07,98.8094,68.6309,95.463,71.9773,100.0239,69.39,90.5209" style="stroke:#475467;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="131.4258" x="80.5" y="138.5996">tomarParaEnviar(seq)</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="103.7051" x="94.3604" y="152.5684">(sale hacia el PC)</text></g><!--link ENVIADO to PENDIENTE--><g id="link_ENVIADO_PENDIENTE"><path d="M106.25,88.7209 C111.94,91.4609 117.84,94.1509 123.5,96.4609 C163.7,112.8909 187.58,94.0609 216.5,126.4609 C232.44,144.3209 235.1794,166.8715 234.9294,185.7615 " fill="none" id="ENVIADO-to-PENDIENTE" style="stroke:#475467;stroke-width:1.0;"/><polygon fill="#475467" points="234.85,191.7609,238.9687,182.8147,234.9162,186.7614,230.9695,182.7088,234.85,191.7609" style="stroke:#475467;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="166.8809" x="232.5" y="138.5996">corte: READY|n con n &lt; seq</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="72.1113" x="279.8848" y="152.5684">(reconciliar)</text></g><!--link ENVIADO to CONFIRMADO--><g id="link_ENVIADO_CONFIRMADO"><path d="M68.43,90.6609 C65.88,101.1609 63.02,114.4409 61.5,126.4609 C52.19,200.2109 52.3099,282.8918 52.9499,321.2418 " fill="none" id="ENVIADO-to-CONFIRMADO" style="stroke:#475467;stroke-width:1.0;"/><polygon fill="#475467" points="53.05,327.2409,56.8993,318.1754,52.9666,322.2416,48.9004,318.3089,53.05,327.2409" style="stroke:#475467;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="111.8203" x="57.5" y="209.5996">ACK|n con n &#8805; seq</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="102.0645" x="62.3779" y="223.5684">(confirmarHasta)</text></g><!--link PENDIENTE to CONFIRMADO--><g id="link_PENDIENTE_CONFIRMADO"><path d="M207.71,232.0909 C173.49,257.4709 118.2595,298.4371 84.0595,323.7971 " fill="none" id="PENDIENTE-to-CONFIRMADO" style="stroke:#475467;stroke-width:1.0;"/><polygon fill="#475467" points="79.24,327.3709,88.8518,325.2233,83.2563,324.3928,84.0868,318.7972,79.24,327.3709" style="stroke:#475467;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="128.0625" x="155.5" y="280.5996">READY|n con n &#8805; seq</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="106.4766" x="166.293" y="294.5684">(el PC ya la ten&#237;a)</text></g><!--link CONFIRMADO to *end*--><g id="link_CONFIRMADO_*end*"><path d="M53.5,367.5509 C53.5,386.1209 53.5,407.6309 53.5,422.3309 " fill="none" id="CONFIRMADO-to-*end*" style="stroke:#475467;stroke-width:1.0;"/><polygon fill="#475467" points="53.5,428.3309,57.5,419.3309,53.5,423.3309,49.5,419.3309,53.5,428.3309" style="stroke:#475467;stroke-width:1.0;"/></g><!--SRC=[NPAnRXD148RxVOgXiv4IAQ914KAox4DOKMmh42IKf9ZipSKZxStQUxiMHhm0Zv62WY9L2YHAxaru4cPzCR7TtUtE_yq_y-yB5kjIIK1DPEUFETNEH8wEuEGr_Fa5v-tzCh4WT3LO-YP_9ZrnP6CA22JW4AOftlelUkUWRXzNxCoSiwPUnBMUDZRm8h8NOwvUti3HqLkO5PFHk9XyBE0KM1eA4KElVoszkuIXn00DgpeGB0BN57nkfFH8hlrPUV