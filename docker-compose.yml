name: inventario-bt

services:
  oracle:
    image: gvenzl/oracle-xe:11-slim
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}
      APP_USER: ${APP_USER}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD}
    ports:
      - "127.0.0.1:1521:1521"
    volumes:
      - oracle-data:/u01/app/oracle/oradata
      - ./db/init:/container-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s

  # Contenedor de desarrollo/pruebas del servidor (perfil "dev": no arranca con `up`).
  pybase:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: docker/pybase/Dockerfile
      args:
        EXTRAS: "dev,bluez"   # dbus-fast: las pruebas de BluezTransport corren aquí (con un bus falso)
    user: "${PUID:-1000}:${PGID:-1000}"
    working_dir: /work
    volumes:
      - ./:/work
    environment:
      DB_DSN: oracle:1521/XE
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      PYTHONPATH: /work/server
    depends_on:
      oracle:
        condition: service_healthy

  # App de escritorio (Tareas 10-13). Con red host: Oracle por el puerto publicado en loopback.
  # Bluetooth: bluetoothd queda en el host y el contenedor le habla por el bus D-Bus (docs/spikes/bluez.md).
  # Pantalla: X11 (en Wayland, XWayland) por el socket y la cookie del usuario. Las pruebas la usan con
  # QT_QPA_PLATFORM=offscreen. BT_TRANSPORT=tcp deja la recepción por TCP (BT_TCP_PORT) en vez de Bluetooth.
  app:
    build:
      context: .
      dockerfile: desktop/Dockerfile
      additional_contexts:
        pybase: "service:pybase"
    user: "${PUID:-1000}:${PGID:-1000}"
    working_dir: /work
    network_mode: host
    cap_add: [NET_ADMIN, NET_RAW]
    restart: "on-failure:5"   # cerrar la ventana sale con 0 y no debe relanzarse; solo los rc≠0 reintentan (incluye crashes en runtime)
    volumes:
      - ./:/work
      - /var/run/dbus:/var/run/dbus
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /etc/localtime:/etc/localtime:ro   # la hora del PC (nombres y fechas de los respaldos)
      - ${XAUTHORITY:-/dev/null}:/tmp/.Xauthority-host:ro
    environment:
      DB_DSN: 127.0.0.1:1521/XE
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      ORA_SDTZ: "+00:00"   # la sesión de Oracle sigue en la zona de la base (TIMESTAMP vs SYSTIMESTAMP); Python, en la del PC
      PYTHONPATH: /work/server:/work/desktop
      PYTHONUNBUFFERED: "1"         # el arranque llega al instante a logs/app.log y a `docker compose logs app`
      HOME: /tmp                    # el usuario 1000 no tiene HOME: sin esto Qt/fontconfig se quejan
      XDG_CACHE_HOME: /tmp/.cache
      DISPLAY: ${DISPLAY:-:0}
      XAUTHORITY: /tmp/.Xauthority-host
      BT_TRANSPORT: ${BT_TRANSPORT:-bluez}
      BT_TCP_PORT: ${BT_TCP_PORT:-9000}
      BT_CON_CLAVE: ${BT_CON_CLAVE:-0}
      FOTOS_DIR: /work/fotos
      RESPALDOS_DIR: /work/respaldos
    depends_on:
      oracle:
        condition: service_healthy
    command: ["/bin/sh", "/work/docker/run-app.sh"]

  # Servicio Bluetooth independiente (Fase 5): recibe a los teléfonos aunque el escritorio esté cerrado.
  # `docker compose up -d bluetooth` lo deja corriendo; con `restart: unless-stopped` vuelve tras reiniciar el PC
  # (si Docker arranca con el sistema). El escritorio ve su estado en Oracle (SERVICIO_BT) y lo pausa o reanuda.
  bluetooth:
    build:
      context: .
      dockerfile: docker/pybase/Dockerfile
      args:
        EXTRAS: "bluez"
    user: "${PUID:-1000}:${PGID:-1000}"
    working_dir: /work
    network_mode: host
    cap_add: [NET_ADMIN, NET_RAW]
    restart: unless-stopped
    volumes:
      - ./:/work
      - /var/run/dbus:/var/run/dbus
      - /etc/localtime:/etc/localtime:ro   # la hora del PC: el respaldo automático sale a la hora configurada
    environment:
      DB_DSN: 127.0.0.1:1521/XE
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      ORA_SDTZ: "+00:00"   # la sesión de Oracle sigue en la zona de la base (TIMESTAMP vs SYSTIMESTAMP); Python, en la del PC
      PYTHONPATH: /work/server
      FOTOS_DIR: /work/fotos
      RESPALDOS_DIR: /work/respaldos
      BT_TRANSPORT: ${BT_TRANSPORT:-bluez}
      BT_TCP_PORT: ${BT_TCP_PORT:-9000}
      BT_CON_CLAVE: ${BT_CON_CLAVE:-0}
    depends_on:
      oracle:
        condition: service_healthy
    command: ["python", "-m", "btsync.servicio"]

  # Compila y prueba la APK (Tareas 14-15). Perfil "build":
  #   docker compose --profile build run --rm apk-build ./gradlew testDebugUnitTest
  apk-build:
    profiles: ["build"]
    build:
      context: ./mobile
    user: "${PUID:-1000}:${PGID:-1000}"
    network_mode: host            # Gradle descarga dependencias; la red bridge puede no tener salida (firewall del host)
    working_dir: /work/mobile
    volumes:
      - ./:/work                  # el repo entero: las pruebas leen docs/protocol-vectors.json
      - gradle-home:/gradle-home  # caché de Gradle, ~/.m2 y la llave de firma debug

  # Diagramas UML (Tareas 16-17): PlantUML con la versión fijada. tools/render_uml.sh lo ejecuta.
  # Fuentes en docs/uml/*.puml; los SVG salen en docs/img/uml/.
  plantuml:
    profiles: ["docs"]
    image: plantuml/plantuml:1.2024.7
    user: "${PUID:-1000}:${PGID:-1000}"
    working_dir: /docs
    environment:
      JAVA_TOOL_OPTIONS: -Duser.home=/tmp   # el uid del host no tiene HOME: Java dejaba su caché de fuentes en docs/?/
    volumes:
      - ./docs:/docs

  # SPIKE desechable (Tarea 8): Bluetooth del host desde un contenedor. Perfil "spike".
  # bluetoothd sigue en el host; el contenedor le habla por el bus de sistema D-Bus.
  # Resultado y flags finales: docs/spikes/bluez.md
  bt-spike:
    profiles: ["spike"]
    build:
      context: .
      dockerfile: docker/pybase/Dockerfile
      args:
        EXTRAS: "dev,bluez"
    user: "${PUID:-1000}:${PGID:-1000}"
    working_dir: /work
    network_mode: host
    cap_add: [NET_ADMIN, NET_RAW]
    stdin_open: true
    tty: true
    volumes:
      - ./:/work
      - /var/run/dbus:/var/run/dbus
    environment:
      # Con network_mode: host no existe el nombre "oracle": se usa el puerto publicado en loopback.
      DB_DSN: 127.0.0.1:1521/XE
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      PYTHONPATH: /work/server

volumes:
  oracle-data:
  gradle-home:

# Subred fija: la que Docker elige sola (p. ej. 172.20.0.0/16) puede chocar con la del Wi-Fi/hotspot
# del host y dejar a Oracle inalcanzable (ORA-12547 desde el puerto publicado).
networks:
  default:
    ipam:
      config:
        - subnet: 10.250.0.0/24
