name: inventario-bt

services:
  oracle:
    image: gvenzl/oracle-xe:11-slim
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}
      APP_USER: ${APP_USER}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD}
    ports:
      - "127.0.0.1:1521:1521"
    volumes:
      - oracle-data:/u01/app/oracle/oradata
      - ./db/init:/container-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s

  # Contenedor de desarrollo/pruebas del servidor (perfil "dev": no arranca con `up`).
  pybase:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: docker/pybase/Dockerfile
      args:
        EXTRAS: "dev,bluez"   # dbus-fast: las pruebas de BluezTransport corren aquí (con un bus falso)
    user: "${PUID:-1000}:${PGID:-1000}"
    working_dir: /work
    volumes:
      - ./:/work
    environment:
      DB_DSN: oracle:1521/XE
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      PYTHONPATH: /work/server
    depends_on:
      oracle:
        condition: service_healthy

  # App de escritorio (Tareas 10-13). Con red host: Oracle por el puerto publicado en loopback.
  # Bluetooth: bluetoothd queda en el host y el contenedor le habla por el bus D-Bus (docs/spikes/bluez.md).
  # Pantalla: X11 (en Wayland, XWayland) por el socket y la cookie del usuario. Las pruebas la usan con
  # QT_QPA_PLATFORM=offscreen. BT_TRANSPORT=tcp deja la recepción por TCP (BT_TCP_PORT) en vez de Bluetooth.
  app:
    build:
      context: .
      dockerfile: desktop/Dockerfile
      additional_contexts:
        pybase: "service:pybase"
    user: "${PUID:-1000}:${PGID:-1000}"
    working_dir: /work
    network_mode: host
    cap_add: [NET_ADMIN, NET_RAW]
    volumes:
      - ./:/work
      - /var/run/dbus:/var/run/dbus
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${XAUTHORITY:-/dev/null}:/tmp/.Xauthority-host:ro
    environment:
      DB_DSN: 127.0.0.1:1521/XE
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      PYTHONPATH: /work/server:/work/desktop
      HOME: /tmp                    # el usuario 1000 no tiene HOME: sin esto Qt/fontconfig se quejan
      XDG_CACHE_HOME: /tmp/.cache
      DISPLAY: ${DISPLAY:-:0}
      XAUTHORITY: /tmp/.Xauthority-host
      BT_TRANSPORT: ${BT_TRANSPORT:-bluez}
      BT_TCP_PORT: ${BT_TCP_PORT:-9000}
      BT_CON_CLAVE: ${BT_CON_CLAVE:-0}
    depends_on:
      oracle:
        condition: service_healthy
    command: ["python", "-m", "app.main"]

  # SPIKE desechable (Tarea 8): Bluetooth del host desde un contenedor. Perfil "spike".
  # bluetoothd sigue en el host; el contenedor le habla por el bus de sistema D-Bus.
  # Resultado y flags finales: docs/spikes/bluez.md
  bt-spike:
    profiles: ["spike"]
    build:
      context: .
      dockerfile: docker/pybase/Dockerfile
      args:
        EXTRAS: "dev,bluez"
    user: "${PUID:-1000}:${PGID:-1000}"
    working_dir: /work
    network_mode: host
    cap_add: [NET_ADMIN, NET_RAW]
    stdin_open: true
    tty: true
    volumes:
      - ./:/work
      - /var/run/dbus:/var/run/dbus
    environment:
      # Con network_mode: host no existe el nombre "oracle": se usa el puerto publicado en loopback.
      DB_DSN: 127.0.0.1:1521/XE
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      PYTHONPATH: /work/server

volumes:
  oracle-data:
